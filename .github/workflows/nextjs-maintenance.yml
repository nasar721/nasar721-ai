name: Next.js maintenance validation

on:
  push:
    branches:
      - maintenance/nextjs-15.5.29-2026-11-10
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/nextjs-maintenance.yml
      - app/api/vector_stores/**
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/nextjs-maintenance.yml
      - app/api/vector_stores/**

permissions:
  contents: read

concurrency:
  group: nextjs-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build application
        run: npm run build
