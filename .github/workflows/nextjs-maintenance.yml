name: Next.js maintenance validation

on:
  push:
    branches:
      - maintenance/nextjs-15.5.29-2026-11-10
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/nextjs-maintenance.yml
      - app/api/vector_stores/**
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/nextjs-maintenance.yml

permissions:
  contents: write

concurrency:
  group: nextjs-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact locked dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Commit refreshed lockfile on maintenance branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already synchronized"
          else
            git commit -m "chore(deps): refresh lockfile for Next.js 15.5.29"
            git push
          fi
